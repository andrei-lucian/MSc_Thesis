# =========================================================
# === Hydra configuration (handles output directories) ===
# =========================================================
hydra:
  job:
    chdir: true  # Hydra will cd into the run dir before launching main()
  run:
    # Single-run output directory
    dir: outputs/${experiment.name}/${now:%Y-%m-%d_%H-%M-%S}
  sweep:
      dir: multirun/${now:%Y-%m-%d_%H-%M-%S}/default
      # This string dictates exactly what the final folder is named
      subdir: ${experiment.name}_width${model.width}_seed${experiment.seed}_linear${model.first_n_linear}_classes${dataset.subset_classes}_noise${dataset.label_noise}

  # Optional Hydra launcher/sweeper configuration (default basic)
  launcher:
    _target_: hydra._internal.core_plugins.basic_launcher.BasicLauncher
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null

# =========================================================
# === Default configuration hierarchy =====================
# =========================================================
defaults:
  - model: resnet18        # default model (can override with model="model_name")
  - dataset: cifar10
  - training: base
  - experiment: default
  - _self_

# =========================================================
# === Global experiment metadata ==========================
# =========================================================
experiment:
  name: default
  seed: 0
  output_dir: outputs/${experiment.name}
